footer { text-align: center; color: var(--text-dim); font-size: 10px; margin-top: 24px; }

/* Overview cards */
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 20px; }
.card { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 18px; }

.card .headline { font-size: 26px; font-weight: 800; margin: 6px 0; }
.card .headline .unit { font-size: 12px; color: var(--text-dim); font-weight: 400; }
.card .sub { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }
.card a.view-link { display: inline-block; margin-top: 6px; color: var(--accent); text-decoration: none; font-size: 11px; }
.card a.view-link:hover { text-decoration: underline; }

/* Insights page */

  display: block; width: 100%; text-align: left;

}
.answer.open { display: block; }
.answer .num { color: var(--accent); font-weight: 700; }

<script>
const DATA = JSON.parse(document.getElementById('report-data').textContent);

function fmtNum(v, suffix) {
  if (v === null || v === undefined) return 'n/a';
  return v + (suffix || '');
}

function rowsFor(model) {
  return DATA.results.filter(r => r.model === model);
}

function findRow(model, quant, build) {
  return DATA.results.find(r => r.model === model && r.quant === quant && r.build === build);
}

function bestKleidiaiSpeedup(model) {
  const rows = rowsFor(model);
  const byQuant = {};
  rows.forEach(r => {
    byQuant[r.quant] = byQuant[r.quant] || {};
    byQuant[r.quant][r.build] = r;
  });
  let best = null;
  for (const quant in byQuant) {
    const base = byQuant[quant].baseline;
    const kleidiai = byQuant[quant].kleidiai;
    if (base && kleidiai && base.decode_tps && kleidiai.decode_tps) {
      const ratio = kleidiai.decode_tps / base.decode_tps;
      if (!best || ratio > best.ratio) best = { quant, ratio };
    }
  }
  return best;
}

const ANSWERS = {
  recommendation: function () {
    let out = '';
    DATA.models.forEach(model => {
      const rec = DATA.recommendations[model];
      if (!rec) return;
      out += `<p><span class="num">${model}</span>: use <span class="num">${rec.quant} / ${rec.build}</span> — `
           + `${fmtNum(rec.decode_tps, ' tok/s decode')}, ${fmtNum(rec.size_mb, ' MB')} on disk. `
           + `This was the fastest combination that safely fit within this device's free RAM at test time.</p>`;
    });
    return out || '<p>No recommendation data available for this run.</p>';
  },

  mechanism: function () {
    const model = DATA.models[0];
    const f16Base = findRow(model, 'F16', 'baseline');
    const f16Kleidiai = findRow(model, 'F16', 'kleidiai');
    const best = bestKleidiaiSpeedup(model);
    let f16Line = '';
    if (f16Base && f16Kleidiai && f16Base.decode_tps) {
      const f16Ratio = (f16Kleidiai.decode_tps / f16Base.decode_tps).toFixed(2);
      f16Line = `<p>On this run, F16 (unquantized) shows a <span class="num">${f16Ratio}x</span> ratio, essentially no change, `
              + `while the best quantized level shows <span class="num">${best ? best.ratio.toFixed(2) : '?'}x</span> `
              + `at ${best ? best.quant : '?'}. That gap is expected, not a bug: it's evidence the speedup is really `
              + `coming from KleidiAI's quantized matrix-multiply kernels, not some unrelated confound.</p>`;
    }
    return `<p>KleidiAI supplies hand-tuned matrix-multiplication kernels for Arm's DotProd CPU instructions, `
         + `which specifically accelerate INT4/INT8 (quantized) arithmetic. They have nothing to accelerate in `
         + `F16 (full-precision) math, so F16 performance should stay roughly the same with or without KleidiAI, `
         + `while quantized formats should speed up substantially.</p>${f16Line}`;
  },

  crossModel: function () {
    if (DATA.models.length < 2) {
      return '<p>Only one model was tested in this run. Run <code>armfit</code> with a comma-separated <code>--model</code> list to compare across model sizes.</p>';
    }
    let out = '<p>Largest KleidiAI speedup observed per model:</p><ul style="margin:10px 0 10px 20px;line-height:2;">';
    const ratios = [];
    DATA.models.forEach(model => {
      const best = bestKleidiaiSpeedup(model);
      if (best) {
        ratios.push(best.ratio);
        out += `<li><span class="num">${model}</span>: ${best.ratio.toFixed(2)}x at ${best.quant}</li>`;
      }
    });
    out += '</ul>';
    if (ratios.length >= 2) {
      const spread = Math.max(...ratios) - Math.min(...ratios);
      out += `<p>The ratios differ by ${spread.toFixed(2)}x across models tested. `
           + `Similar (not identical) ratios across different model sizes is evidence this is a real, `
           + `repeatable hardware effect rather than a one-off result specific to a single model.</p>`;
    }
    return out;
  },

  baselineQuant: function () {
    const model = DATA.models[0];
    const f16Base = findRow(model, 'F16', 'baseline');
    const q4Base = findRow(model, 'Q4_0', 'baseline');
    if (!f16Base || !q4Base || !f16Base.prefill_tps || !q4Base.prefill_tps) {
      return '<p>Not enough baseline F16/Q4_0 data in this run to illustrate this.</p>';
    }
    const slower = q4Base.prefill_tps < f16Base.prefill_tps;
    const comparison = slower
      ? `is actually <span class="num">slower</span> prefill (${q4Base.prefill_tps} vs ${f16Base.prefill_tps} tok/s) despite being a much smaller file`
      : `is ${(q4Base.prefill_tps / f16Base.prefill_tps).toFixed(2)}x prefill speed vs F16 (${q4Base.prefill_tps} vs ${f16Base.prefill_tps} tok/s)`;
    return `<p>Without Arm-specific acceleration, quantization doesn't automatically mean faster: in this run, `
         + `Q4_0 on the <em>baseline</em> (non-KleidiAI) build ${comparison}. On budget Arm chips lacking `
         + `dedicated quantized-matmul kernels, the CPU can fall back to slow, generic unpacking of quantized `
         + `weights. This is why the KleidiAI comparison matters: it isn't just an optimization on top of `
         + `quantization, on this hardware it's what makes quantization pay off at all.</p>`;
  },

  methodology: function () {
    return `<p>Speed numbers were measured with <code>llama-bench</code> running directly on the device `
         + `(<span class="num">${DATA.device}</span>, ~${DATA.free_ram_mb} MB free RAM at test time), each `
         + `configuration run 3 times and averaged, pushed and executed over <code>adb</code>, not simulated `
         + `or estimated. Two separate compiled builds of the same llama.cpp source were compared: one with `
         + `Arm KleidiAI kernels compiled in, one without, isolating the Arm-specific contribution from `
         + `quantization itself.</p>`;
  },

  ttft: function () {
    return `<p><strong>TTFT (time to first token)</strong> is how long a user waits after sending a prompt `
         + `before the model starts responding, it's derived here from measured prefill (prompt-processing) `
         + `speed: the time needed to process the input prompt before generation begins. Lower is better, `
         + `it's the latency a person actually feels while waiting for a reply to start.</p>`;
  },
};

function toggleAnswer(key, btn) {
  document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.answer').forEach(a => a.classList.remove('open'));
  btn.classList.add('active');
  const answerEl = document.getElementById('answer-' + key);
  answerEl.innerHTML = ANSWERS[key]();
  answerEl.classList.add('open');
}
</script>
